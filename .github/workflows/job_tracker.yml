name: Sales Trading Job Tracker

# Production = the hourly schedule (or a manual run) on main: sends Telegram
# alerts and commits seen_jobs.json. Every other branch/push is a dry run.
on:
  schedule:
    # Every 30 min from 11:07 to 22:37 Vietnam time (UTC+7, no DST): GitHub
    # drops many scheduled runs, so extra triggers keep the 2-hour rhythm.
    # tracker.py sends at most once per notifications.min_minutes_between_sends
    # (100 min) on scheduled runs and never outside 11:00-22:59 Vietnam time.
    - cron: "7,37 4-15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no Telegram alerts, no state commit)
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths:
      - 'job_tracker/**'
      - '.github/workflows/job_tracker.yml'

permissions:
  contents: write

concurrency:
  group: job-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job_tracker/requirements.txt
      - run: pip install -r job_tracker/requirements.txt
      - name: Unit and integration tests (offline)
        working-directory: job_tracker
        run: python -m unittest discover -s tests -t . -v

  track:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRODUCTION: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job_tracker/requirements.txt
      - run: pip install -r job_tracker/requirements.txt

      # A queued run checks out the commit it was triggered on, which may
      # predate the previous run's history commit: always start from the
      # latest seen_jobs.json on main, or alerts could be re-sent and the
      # history push would conflict (2026-10-22).
      - name: Load latest tracking history
        if: env.PRODUCTION == 'true'
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- job_tracker/seen_jobs.json

      - name: Restore vacancy detail cache
        uses: actions/cache@v4
        with:
          path: job_tracker/.cache
          key: vacancy-details-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            vacancy-details-${{ github.ref_name }}-
            vacancy-details-main-

      - name: Check Telegram credentials (no message sent)
        if: env.PRODUCTION == 'true'
        working-directory: job_tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py --check-telegram

      - name: Run job tracker
        working-directory: job_tracker
        env:
          DRY_RUN: ${{ env.PRODUCTION == 'true' && '0' || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ env.PRODUCTION == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ env.PRODUCTION == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python tracker.py

      - name: Print diagnostic report
        if: always()
        run: cat job_tracker/reports/last_run.md || echo "No report produced"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-report-${{ github.run_id }}
          path: job_tracker/reports/last_run.md
          retention-days: 14

      - name: Save tracking history
        if: always() && env.PRODUCTION == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp job_tracker/seen_jobs.json "$RUNNER_TEMP/seen_jobs.json"
          # Runs are serialized (concurrency group) and this run started from
          # main's latest history, so its file is the newest history: put it
          # on top of the current main tip instead of rebasing a stale diff.
          for attempt in 1 2 3 4; do
            git fetch --no-tags --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/seen_jobs.json" job_tracker/seen_jobs.json
            git add job_tracker/seen_jobs.json
            if git diff --cached --quiet; then
              echo "No state change"; exit 0
            fi
            git commit -q -m "Update tracked jobs [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
