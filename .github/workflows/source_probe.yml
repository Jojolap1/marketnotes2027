name: Source probe (diagnostic)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Only run probes whose name contains this text
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths: ['job_tracker/tools/**', '.github/workflows/source_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r job_tracker/requirements.txt
      - name: Probe candidate public career feeds
        run: set -o pipefail; python job_tracker/tools/probe_sources.py "${{ github.event.inputs.filter }}" 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-log
          path: probe.log
